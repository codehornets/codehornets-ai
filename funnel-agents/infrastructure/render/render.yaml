# =============================================================================
# FunnelAgents - Render Blueprint
# https://render.com/docs/blueprint-spec
# =============================================================================

# Databases
databases:
  - name: funnelagents-postgres
    databaseName: funnel_agents
    user: funnel_agents_admin
    plan: standard
    region: oregon
    postgresMajorVersion: "16"
    ipAllowList: []

  - name: funnelagents-redis
    plan: standard
    region: oregon

# =============================================================================
# Backend Services
# =============================================================================
services:
  # API Gateway - Main entry point
  - type: web
    name: funnelagents-api-gateway
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE
        value: api-gateway
      - key: PORT
        value: "3000"
      - key: DB_HOST
        fromDatabase:
          name: funnelagents-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: funnelagents-postgres
          property: port
      - key: DB_NAME
        value: funnel_agents
      - key: DB_USERNAME
        fromDatabase:
          name: funnelagents-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: funnelagents-postgres
          property: password
      - key: REDIS_HOST
        fromDatabase:
          name: funnelagents-redis
          property: host
      - key: REDIS_PORT
        fromDatabase:
          name: funnelagents-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRATION
        value: "1d"

  # Auth Service
  - type: web
    name: funnelagents-auth-service
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE
        value: auth-service
      - key: PORT
        value: "3001"
      - key: DB_HOST
        fromDatabase:
          name: funnelagents-postgres
          property: host
      - key: DB_PORT
        fromDatabase:
          name: funnelagents-postgres
          property: port
      - key: DB_NAME
        value: funnel_agents
      - key: DB_USERNAME
        fromDatabase:
          name: funnelagents-postgres
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: funnelagents-postgres
          property: password
      - key: REDIS_HOST
        fromDatabase:
          name: funnelagents-redis
          property: host
      - key: REDIS_PORT
        fromDatabase:
          name: funnelagents-redis
          property: port
      - key: JWT_SECRET
        sync: false

  # CRM Service
  - type: web
    name: funnelagents-crm-service
    runtime: docker
    region: oregon
    plan: standard
    dockerfilePath: ./infrastructure/docker/Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true
    envVars:
