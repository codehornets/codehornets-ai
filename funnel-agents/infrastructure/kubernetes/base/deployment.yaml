---
# =============================================================================
# n8n - Workflow automation platform
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  labels:
    app: funnelagents
    service: n8n
    component: automation
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: funnelagents
      service: n8n
  template:
    metadata:
      labels:
        app: funnelagents
        service: n8n
        component: automation
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5678
          env:
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "http"
            - name: N8N_HOST
              value: "localhost"
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: QUEUE_BULL_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: REDIS_HOST
            - name: QUEUE_BULL_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: REDIS_PORT
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: DB_HOST
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: DB_PORT
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: funnelagents-secrets
                  key: DB_USERNAME
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funnelagents-secrets
                  key: DB_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: funnelagents-secrets
                  key: N8N_ENCRYPTION_KEY
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2048Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data

---
# =============================================================================
# n8n Worker - Background workflow execution
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n-worker
  labels:
    app: funnelagents
    service: n8n-worker
    component: automation
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: funnelagents
      service: n8n-worker
  template:
    metadata:
      labels:
        app: funnelagents
        service: n8n-worker
        component: automation
    spec:
      containers:
        - name: n8n-worker
          image: n8nio/n8n:latest
          imagePullPolicy: Always
          command: ["n8n", "worker"]
          env:
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: QUEUE_BULL_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: REDIS_HOST
            - name: QUEUE_BULL_REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: REDIS_PORT
            - name: DB_TYPE
              value: "postgresdb"
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: DB_HOST
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: funnelagents-config
                  key: DB_PORT
            - name: DB_POSTGRESDB_DATABASE
              value: "n8n"
            - name: DB_POSTGRESDB_USER
              valueFrom:
                secretKeyRef:
                  name: funnelagents-secrets
                  key: DB_USERNAME
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: funnelagents-secrets
                  key: DB_PASSWORD
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: funnelagents-secrets
                  key: N8N_ENCRYPTION_KEY
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
