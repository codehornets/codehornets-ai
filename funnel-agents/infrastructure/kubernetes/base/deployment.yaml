  name: scheduler
  labels:
    app: funnelagents
    service: scheduler
    component: worker
spec:
  replicas: 1  # Only 1 scheduler to avoid duplicate jobs
  strategy:
    type: Recreate  # Ensure only one instance runs at a time
  selector:
    matchLabels:
      app: funnelagents
      service: scheduler
  template:
    metadata:
      labels:
        app: funnelagents
        service: scheduler
        component: worker
    spec:
      containers:
        - name: scheduler
          image: ghcr.io/funnelagents/scheduler:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3010
          env:
            - name: NODE_ENV
              value: "production"
