# =============================================================================
# FunnelAgents - Kubernetes Deployment Manifests
# All NestJS microservices + React frontend + n8n
# =============================================================================
#
# Services deployed:
#   - api-gateway (Port 3000)
#   - auth-service (Port 3001)
#   - crm-service (Port 3002)
#   - campaigns-service (Port 3003)
#   - content-service (Port 3004)
#   - agents-service (Port 3005)
#   - tasks-service (Port 3006)
#   - automations-service (Port 3007)
#   - reports-service (Port 3008)
#   - worker-runner (Port 3009)
#   - scheduler (Port 3010)
#   - web-ui (Port 4200)
#   - n8n (Port 5678)
#
# Usage:
#   kubectl apply -f deployment.yaml -n funnelagents
#
# Note: Use Kustomize overlays for environment-specific settings.

---
# =============================================================================
# API Gateway - Main entry point for all services
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  labels:
    app: funnelagents
    service: api-gateway
    component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: funnelagents
      service: api-gateway
  template:
    metadata:
      labels:
        app: funnelagents
        service: api-gateway
        component: backend
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
        - name: api-gateway
          image: ghcr.io/funnelagents/api-gateway:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3000
              protocol: TCP
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "3000"
            - name: SERVICE_NAME
              value: "api-gateway"
          envFrom:
            - configMapRef:
                name: funnelagents-config
            - secretRef:
                name: funnelagents-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2

