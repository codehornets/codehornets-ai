              value: "3010"
            - name: SERVICE_NAME
              value: "scheduler"
          envFrom:
            - configMapRef:
                name: funnelagents-config
            - secretRef:
                name: funnelagents-secrets
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
