name: funnel-agents-prod

services:
  # ==========================================================================
  # Nginx Reverse Proxy & Load Balancer
  # ==========================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: funnel-agents-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - nginx-cache:/var/cache/nginx
      - nginx-logs:/var/log/nginx
    depends_on:
      - api-gateway
      - web-ui
      - n8n
    networks:
      - funnel-agents-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.funnelagents.service=nginx"
      - "com.funnelagents.environment=production"

  # ==========================================================================
  # Infrastructure Services
  # ==========================================================================

  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: funnel-agents-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.utf8"
      PGDATA: /var/lib/postgresql/data/pgdata
    secrets:
      - postgres_password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - postgres-backups:/backups
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - funnel-agents-network
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.funnelagents.service=postgres"
      - "com.funnelagents.environment=production"

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: funnel-agents-redis
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --auto-aof-rewrite-percentage 100
      --auto-aof-rewrite-min-size 64mb
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - funnel-agents-network
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    labels:
      - "com.funnelagents.service=redis"
      - "com.funnelagents.environment=production"

  # ==========================================================================
  # NestJS Microservices
  # ==========================================================================

  # API Gateway (port 3000)
  api-gateway:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.prod
      args:
        SERVICE: api-gateway
        NODE_VERSION: "20"
    image: funnel-agents/api-gateway:${IMAGE_TAG:-latest}
    container_name: funnel-agents-api-gateway
    restart: always
    environment:
      NODE_ENV: production
      API_GATEWAY_PORT: 3000
      AUTH_SERVICE_HOST: auth-service
      AUTH_SERVICE_PORT: 3001
      CRM_SERVICE_HOST: crm-service
      CRM_SERVICE_PORT: 3002
      CAMPAIGNS_SERVICE_HOST: campaigns-service
      CAMPAIGNS_SERVICE_PORT: 3003
      CONTENT_SERVICE_HOST: content-service
      CONTENT_SERVICE_PORT: 3004
      AGENTS_SERVICE_HOST: agents-service
      AGENTS_SERVICE_PORT: 3005
      TASKS_SERVICE_HOST: tasks-service
      TASKS_SERVICE_PORT: 3006
      AUTOMATIONS_SERVICE_HOST: automations-service
      AUTOMATIONS_SERVICE_PORT: 3007
      REPORTS_SERVICE_HOST: reports-service
      REPORTS_SERVICE_PORT: 3008
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - funnel-agents-network
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    labels:
      - "com.funnelagents.service=api-gateway"
      - "com.funnelagents.environment=production"

  # Auth Service (port 3001)
  auth-service:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile.prod
      args:
        SERVICE: auth-service
        NODE_VERSION: "20"
    image: funnel-agents/auth-service:${IMAGE_TAG:-latest}
    container_name: funnel-agents-auth-service
    restart: always
    environment:
      NODE_ENV: production
      AUTH_SERVICE_HOST: 0.0.0.0
      AUTH_SERVICE_PORT: 3001
      JWT_SECRET_FILE: /run/secrets/jwt_secret
      JWT_EXPIRATION: ${JWT_EXPIRATION:-1d}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DATABASE_URL_FILE: /run/secrets/database_url
    secrets:
      - database_url
      - jwt_secret
    depends_on:
      postgres:
        condition: service_healthy
      redis:
