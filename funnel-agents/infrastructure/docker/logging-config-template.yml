# Logging Configuration Template for Docker Compose Services
#
# Add this configuration to each service in docker-compose.yml

# Example service with enhanced logging configuration:
example-service:
  build:
    context: ../..
    dockerfile: infrastructure/docker/Dockerfile
    args:
      - SERVICE=example-service
  container_name: funnel-agents-example-service
  restart: unless-stopped
  environment:
    - NODE_ENV=${NODE_ENV:-development}
    # ... other environment variables ...

    # Logging Configuration
    - LOG_LEVEL=${LOG_LEVEL:-info}
    - LOG_FORMAT=${LOG_FORMAT:-json}
    - APP_VERSION=${APP_VERSION:-1.0.0}

  # Docker logging driver configuration
  logging:
    driver: "json-file"
    options:
      max-size: "10m"           # Maximum size of log file before rotation
      max-file: "3"             # Maximum number of log files to retain
      labels: "service,environment"
      tag: "{{.Name}}/{{.ImageName}}/{{.ID}}"
      env: "NODE_ENV,LOG_LEVEL"

  # Labels for log aggregation and filtering
  labels:
    - "service=example-service"
    - "environment=${NODE_ENV:-development}"
    - "logging.enabled=true"
    - "logging.format=${LOG_FORMAT:-json}"

# ============================================================================
# Log Level Options
# ============================================================================
# LOG_LEVEL values (from least to most verbose):
# - error   : Only errors
# - warn    : Warnings and errors
# - info    : Info, warnings, and errors (recommended for production)
# - debug   : Debug, info, warnings, and errors (recommended for development)
# - trace   : All logs including verbose trace information

# ============================================================================
# Log Format Options
# ============================================================================
# LOG_FORMAT values:
# - json    : Structured JSON format (recommended for production)
#             Compatible with ELK, CloudWatch, Datadog, etc.
# - pretty  : Human-readable colored format (recommended for development)

# ============================================================================
# Docker Logging Driver Options
# ============================================================================

# Option 1: JSON File (Default, good for development)
logging:
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

