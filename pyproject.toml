[project]
name = "codehornets-ai"
version = "0.1.0"
description = "Multi-Agent Orchestration System with PTY-based agent communication"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pexpect>=4.9.0",
    "watchdog>=4.0.0",
    "redis>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
pty-orchestrator = "tools.pty_orchestrator:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tools"]
